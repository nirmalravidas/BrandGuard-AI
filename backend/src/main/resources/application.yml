spring:
  application:
    name: brandguard-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/brandguard}}
    username: ${DATABASE_USERNAME:brandguard}
    password: ${DATABASE_PASSWORD:brandguard}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  port: ${PORT:8080}
  error:
    include-message: always
brandguard:
  ai:
    api-key: ${OPENAI_API_KEY:}
    endpoint: ${OPENAI_CHAT_COMPLETIONS_URL:https://api.openai.com/v1/chat/completions}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
